<!doctype html><meta charset="utf-8"><body style="background:#12121a;margin:0;padding:12px;font:11px system-ui;color:#cfc9bb">
<div id="out" style="display:flex;flex-wrap:wrap;gap:10px"></div>
<script type="module">
import { SPRITES } from '/src/platform/art/sprites.js'
import { PALETTE } from '/src/platform/art/palette.js'
const out = document.getElementById('out')
const Z = 3
for (const [name, sd] of Object.entries(SPRITES)) {
  const wrap = document.createElement('div')
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:3px;width:'+Math.max(70, sd.w*Z+8)+'px'
  const c = document.createElement('canvas')
  c.width = sd.w*Z; c.height = sd.h*Z
  c.style.cssText = 'image-rendering:pixelated;background:#1e1e2a;outline:1px solid #33334a'
  const ctx = c.getContext('2d')
  for (let y=0;y<sd.h;y++) for (let x=0;x<sd.w;x++) {
    const ch = sd.rows[y][x]
    if (ch === '.') continue
    ctx.fillStyle = PALETTE[ch] || '#ff00ff'
    ctx.fillRect(x*Z, y*Z, Z, Z)
  }
  const label = document.createElement('div'); label.textContent = name
  wrap.append(c, label); out.appendChild(wrap)
}
document.title = 'ready:' + Object.keys(SPRITES).length
</script></body>

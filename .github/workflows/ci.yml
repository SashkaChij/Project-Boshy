name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assert zero runtime dependencies
        # The whole architecture rests on the core being dependency-free and
        # DOM-free. Catching a stray dependency here is cheaper than finding it
        # in a bundle six months from now.
        run: |
          node -e "
            const p = require('./package.json');
            const deps = Object.keys(p.dependencies || {});
            if (deps.length) { console.error('Runtime dependencies are not allowed:', deps); process.exit(1); }
            console.log('OK: zero runtime dependencies');
          "
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Report bundle size
        # Reported, never enforced. A hard size gate on a PWA that is cached
        # once creates pressure to cut content to satisfy a number no player
        # ever experiences.
        run: |
          echo "### Bundle size" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find dist -name '*.js' -o -name '*.css' | while read f; do
            printf '%-46s %6s raw  %6s gzip\n' "${f#dist/}" \
              "$(du -h "$f" | cut -f1)" "$(gzip -9 -c "$f" | wc -c | awk '{printf "%.0fK", $1/1024}')"
          done >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
